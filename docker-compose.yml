services:
  api:
    build: .
    ports:
      - "${API_PORT:-4000}:4000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4000
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-secreto-solo-local-que-no-sirve-para-produccion-0123456789-abcdefghijklmnop}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGO_URL: mongodb://mongo:27017/messaging_dev
      RABBITMQ_URL: ${RABBITMQ_URL_DOCKER:-amqp://guest:guest@host.docker.internal:5672}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-discordia_messaging}
      DATABASE_USER: ${DATABASE_USER:-discordia}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-discordia}
      DATABASE_SCHEMA: public
      DATABASE_SSLMODE: disable
      ADMIN_EVENTS_HMAC_SECRET: ${ADMIN_EVENTS_HMAC_SECRET:-secreto-admin-solo-local}
      BILLING_EVENTS_HMAC_SECRET: ${BILLING_EVENTS_HMAC_SECRET:-secreto-billing-solo-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    image: migrate/migrate
    command:
      - "-path=/migrations"
      - "-database=postgres://${DATABASE_USER:-discordia}:${DATABASE_PASSWORD:-discordia}@postgres:5432/${DATABASE_NAME:-discordia_messaging}?sslmode=disable"
      - "up"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-discordia_messaging}
      POSTGRES_USER: ${DATABASE_USER:-discordia}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-discordia}
    ports:
      - "${DATABASE_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DATABASE_USER:-discordia} -d ${DATABASE_NAME:-discordia_messaging}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping: 1})"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
  postgres_data:
