---
components:
  responses: {}
  schemas:
    Attachment:
      properties:
        content_type:
          description: Detectado por el contenido real del archivo, no por el que declaró el cliente
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - application/pdf
          type: string
          x-struct:
          x-validate:
        id:
          format: uuid
          type: string
          x-struct:
          x-validate:
        name:
          description: Nombre original, ya saneado
          type: string
          x-struct:
          x-validate:
        size:
          description: Tamaño en bytes
          type: integer
          x-struct:
          x-validate:
        url:
          description: URL pública del archivo en el almacenamiento (Supabase Storage)
          format: uri
          type: string
          x-struct:
          x-validate:
      required:
        - id
        - url
        - name
        - content_type
        - size
      title: Attachment
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.Attachment
      x-validate:
    BlockList:
      properties:
        blocks:
          items:
            properties:
              created_at:
                format: date-time
                type: string
                x-struct:
                x-validate:
              user_id:
                description: El usuario que bloqueaste
                type: string
                x-struct:
                x-validate:
            required:
              - user_id
              - created_at
            type: object
            x-struct:
            x-validate:
          type: array
          x-struct:
          x-validate:
      required:
        - blocks
      title: BlockList
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.BlockList
      x-validate:
    BlockRequest:
      properties:
        user_id:
          description: Id del usuario a bloquear
          type: string
          x-struct:
          x-validate:
      required:
        - user_id
      title: BlockRequest
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.BlockRequest
      x-validate:
    Conversation:
      properties:
        blocked_by_me:
          description: true si bloqueaste al otro participante (nunca se informa lo contrario)
          type: boolean
          x-struct:
          x-validate:
        id:
          description: Id de la conversación (un canal)
          format: uuid
          type: string
          x-struct:
          x-validate:
        last_message:
          allOf:
            - $ref: '#/components/schemas/Message'
          description: null si el último mensaje fue eliminado
          nullable: true
          x-struct:
          x-validate:
        last_message_at:
          format: date-time
          nullable: true
          type: string
          x-struct:
          x-validate:
        partner_id:
          description: El otro participante
          type: string
          x-struct:
          x-validate:
        unread:
          description: true si el último mensaje es del otro y todavía no lo marcaste como leído
          type: boolean
          x-struct:
          x-validate:
      required:
        - id
        - partner_id
        - unread
        - blocked_by_me
      title: Conversation
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.Conversation
      x-validate:
    ConversationList:
      properties:
        conversations:
          items:
            $ref: '#/components/schemas/Conversation'
          type: array
          x-struct:
          x-validate:
      required:
        - conversations
      title: ConversationList
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.ConversationList
      x-validate:
    EditMessageRequest:
      properties:
        content:
          description: Contenido nuevo (máx. 2000 caracteres, se recorta)
          type: string
          x-struct:
          x-validate:
      required:
        - content
      title: EditMessageRequest
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.EditMessageRequest
      x-validate:
    ErrorResponse:
      properties:
        error:
          properties:
            code:
              type: string
              x-struct:
              x-validate:
            details:
              type: object
              x-struct:
              x-validate:
            message:
              type: string
              x-struct:
              x-validate:
          required:
            - code
            - message
            - details
          type: object
          x-struct:
          x-validate:
      required:
        - error
      title: ErrorResponse
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.ErrorResponse
      x-validate:
    Mention:
      description: 'Una notificación destacada: un mensaje que te mencionó y todavía no leíste.'
      properties:
        author_id:
          description: Quien te mencionó
          type: string
          x-struct:
          x-validate:
        channel_id:
          format: uuid
          type: string
          x-struct:
          x-validate:
        id:
          description: '`<message_id>:<user_id>`'
          type: string
          x-struct:
          x-validate:
        inserted_at:
          format: date-time
          type: string
          x-struct:
          x-validate:
        message:
          allOf:
            - $ref: '#/components/schemas/Message'
          description: El mensaje; null si ya no está disponible
          nullable: true
          x-struct:
          x-validate:
        message_id:
          format: uuid
          type: string
          x-struct:
          x-validate:
        server_id:
          format: uuid
          type: string
          x-struct:
          x-validate:
      required:
        - id
        - message_id
        - channel_id
        - server_id
        - author_id
        - inserted_at
        - message
      title: Mention
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.Mention
      x-validate:
    MentionList:
      properties:
        mentions:
          items:
            $ref: '#/components/schemas/Mention'
          type: array
          x-struct:
          x-validate:
      required:
        - mentions
      title: MentionList
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.MentionList
      x-validate:
    Message:
      properties:
        attachments:
          description: Archivos adjuntos del mensaje (vacío si no tiene)
          items:
            $ref: '#/components/schemas/Attachment'
          type: array
          x-struct:
          x-validate:
        channel_id:
          format: uuid
          type: string
          x-struct:
          x-validate:
        content:
          type: string
          x-struct:
          x-validate:
        edited:
          description: true si el autor lo editó después de enviarlo
          type: boolean
          x-struct:
          x-validate:
        edited_at:
          description: Momento de la última edición (ISO 8601, UTC); null si nunca se editó
          format: date-time
          nullable: true
          type: string
          x-struct:
          x-validate:
        id:
          format: uuid
          type: string
          x-struct:
          x-validate:
        inserted_at:
          description: ISO 8601, UTC, always with a trailing Z
          format: date-time
          type: string
          x-struct:
          x-validate:
        mention_everyone:
          description: true si el mensaje mencionó `@everyone` y el autor tiene MENTION_EVERYONE; si no, queda como texto
          type: boolean
          x-struct:
          x-validate:
        mention_roles:
          description: Ids de los roles mencionados con `<@&id>`; solo cuentan si el autor tiene MENTION_EVERYONE
          items:
            type: string
            x-struct:
            x-validate:
          type: array
          x-struct:
          x-validate:
        mentions:
          description: Ids de los usuarios mencionados con `<@id>` que son miembros del servidor (vacío en mensajes directos)
          items:
            type: string
            x-struct:
            x-validate:
          type: array
          x-struct:
          x-validate:
        reactions:
          description: Reacciones del mensaje, en el orden en que se usó cada emoji por primera vez. Viene en el historial; los eventos `new_message` y `message_updated` no la traen.
          items:
            properties:
              count:
                minimum: 1
                type: integer
                x-struct:
                x-validate:
              emoji:
                type: string
                x-struct:
                x-validate:
              reacted_by_me:
                description: true si quien pide el historial es uno de los que reaccionó
                type: boolean
                x-struct:
                x-validate:
            required:
              - emoji
              - count
              - reacted_by_me
            type: object
            x-struct:
            x-validate:
          type: array
          x-struct:
          x-validate:
        server_id:
          description: null en los mensajes directos (no pertenecen a ningún servidor)
          format: uuid
          nullable: true
          type: string
          x-struct:
          x-validate:
        user_id:
          type: string
          x-struct:
          x-validate:
      required:
        - id
        - channel_id
        - server_id
        - user_id
        - content
        - inserted_at
        - edited
        - mentions
        - mention_roles
        - mention_everyone
        - attachments
      title: Message
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.Message
      x-validate:
    MessageList:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          x-struct:
          x-validate:
        newer_cursor:
          description: 'Solo con `around`: id para pasar como `after` mientras haya mensajes más nuevos. null si ya se llegó al presente.'
          nullable: true
          type: string
          x-struct:
          x-validate:
        next_cursor:
          description: 'Hay más mensajes: id para pasar como `before` (o como `after` si se pidió con `after`). null si no hay más.'
          nullable: true
          type: string
          x-struct:
          x-validate:
      required:
        - messages
        - next_cursor
      title: MessageList
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.MessageList
      x-validate:
    MessageLookup:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          x-struct:
          x-validate:
      required:
        - messages
      title: MessageLookup
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.MessageLookup
      x-validate:
    MessageSearchResult:
      description: Coincidencias de la búsqueda, de la más nueva a la más vieja. Sin coincidencias, `messages` viene vacío (no es un error).
      properties:
        messages:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          x-struct:
          x-validate:
        next_cursor:
          description: 'Hay más coincidencias: id para pasar como `before` y traer las más viejas. null si no hay más.'
          nullable: true
          type: string
          x-struct:
          x-validate:
        total:
          description: Cuántas coincidencias hay en total (con tope de 1000). Solo en la primera página; con `before` viene null.
          nullable: true
          type: integer
          x-struct:
          x-validate:
        total_capped:
          description: true si hay más coincidencias que el tope (mostrar "1000+")
          nullable: true
          type: boolean
          x-struct:
          x-validate:
      required:
        - messages
        - next_cursor
        - total
        - total_capped
      title: MessageSearchResult
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.MessageSearchResult
      x-validate:
    Presence:
      properties:
        status:
          description: 'Lo que ven los demás: `invisible` se ve como `offline`, y también quien tiene un bloqueo con vos (en cualquier dirección)'
          enum:
            - online
            - idle
            - dnd
            - offline
          type: string
          x-struct:
          x-validate:
        user_id:
          type: string
          x-struct:
          x-validate:
        version:
          description: Crece con cada cambio. Entre esta respuesta y los `presence_updated` del socket, vale el de versión más alta; 0 si el usuario nunca se conectó
          type: integer
          x-struct:
          x-validate:
      required:
        - user_id
        - status
        - version
      title: Presence
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.Presence
      x-validate:
    PresenceList:
      properties:
        presences:
          description: Uno por cada id pedido, en el mismo orden
          items:
            $ref: '#/components/schemas/Presence'
          type: array
          x-struct:
          x-validate:
      required:
        - presences
      title: PresenceList
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.PresenceList
      x-validate:
    SocketTicket:
      properties:
        expires_in:
          description: Segundos que el ticket es válido desde que se emite.
          type: integer
          x-struct:
          x-validate:
        ticket:
          description: Ticket de un solo uso. Se manda como `?ticket=<ticket>` al conectar el WebSocket.
          type: string
          x-struct:
          x-validate:
      required:
        - ticket
        - expires_in
      title: SocketTicket
      type: object
      x-struct: Elixir.MessagingWeb.Schemas.SocketTicket
      x-validate:
info:
  description: Mensajes de canal en tiempo real (envío por WebSocket, historial por REST). Todos los endpoints responden 403 ACCOUNT_SUSPENDED a una cuenta suspendida por el staff y 503 SUSPENSION_UNAVAILABLE si no se pudo verificar su estado.
  title: Discordia — Messaging
  version: 0.1.0
openapi: 3.0.0
paths:
  /livez:
    get:
      callbacks: {}
      operationId: MessagingWeb.HealthController.livez
      parameters: []
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
                x-struct:
                x-validate:
          description: ok
      summary: Liveness -- confirma que el proceso responde, sin tocar Mongo ni el broker
      tags:
        - ops
  /readyz:
    get:
      callbacks: {}
      operationId: MessagingWeb.HealthController.readyz
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                x-struct:
                x-validate:
          description: ready
        '503':
          content:
            application/json:
              schema:
                type: object
                x-struct:
                x-validate:
          description: Mongo o Postgres no responden
      summary: Readiness -- confirma que el servicio puede operar (pinguea Mongo y Postgres)
      tags:
        - ops
  /v1/attachments:
    post:
      callbacks: {}
      description: El cuerpo del pedido es el archivo en binario (no multipart ni base64). Se acepta JPEG, PNG, WebP o PDF de hasta 10 MB; el formato se reconoce por el contenido real del archivo, no por la extensión ni por el `Content-Type`. Indicá el destino con `channel_id` (canal de un servidor) o con `to` (id del usuario, para un mensaje directo), nunca los dos. Hay que tener permiso de escribir ahí. La respuesta trae el `id` que se manda después en `attachment_ids` al enviar el mensaje por el WebSocket (`new_message` o `send_dm`). Un archivo que no se adjunta a ningún mensaje en 24 horas se borra solo. Se pueden adjuntar hasta 5 archivos por mensaje.
      operationId: MessagingWeb.AttachmentController.create
      parameters:
        - description: Canal de texto de un servidor donde se va a enviar el mensaje
          in: query
          name: channel_id
          required: false
          schema:
            type: string
            x-struct:
            x-validate:
        - description: Id del usuario destinatario de un mensaje directo
          in: query
          name: to
          required: false
          schema:
            type: string
            x-struct:
            x-validate:
        - description: Nombre con el que se muestra el archivo (máx 100 caracteres)
          in: query
          name: filename
          required: false
          schema:
            type: string
            x-struct:
            x-validate:
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
              x-struct:
              x-validate:
        description: Contenido del archivo
        required: false
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: Archivo subido
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Archivo vacío, destino mal indicado, o demasiados archivos sin enviar
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Sin permiso para escribir en ese canal, silenciado, o bloqueado en el mensaje directo
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El canal o el destinatario no existen
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El archivo supera el máximo permitido
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Formato no soportado
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Demasiados archivos subidos sin enviar
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo guardar el archivo
      summary: Subir un archivo para adjuntarlo a un mensaje
      tags:
        - attachments
  /v1/blocks:
    get:
      callbacks: {}
      description: Solo ves a quién bloqueaste vos, la más reciente primero. Nunca se informa quién te bloqueó a vos.
      operationId: MessagingWeb.BlockController.index
      parameters:
        - description: Cantidad máxima (default 50, máx 100)
          in: query
          name: limit
          required: false
          schema:
            type: integer
            x-struct:
            x-validate:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockList'
          description: Usuarios bloqueados
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
      summary: Usuarios que bloqueé
      tags:
        - blocks
    post:
      callbacks: {}
      description: 'Desde ese momento ninguno de los dos puede enviarle mensajes directos al otro, ni editar ni borrar los que ya envió: la persona bloqueada recibe `DM_NOT_DELIVERED` sin saber por qué, y quien bloqueó recibe `USER_BLOCKED`. El historial de la conversación se conserva para los dos. Es idempotente: bloquear a alguien ya bloqueado también responde 204. Se verifica que el usuario exista.'
      operationId: MessagingWeb.BlockController.create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockRequest'
        description: Usuario a bloquear
        required: false
      responses:
        '204':
          description: Usuario bloqueado
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Intentó bloquearse a sí mismo, o el cuerpo está mal formado
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El usuario no existe
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo verificar al usuario
      summary: Bloquear a un usuario
      tags:
        - blocks
  /v1/blocks/{user_id}:
    delete:
      callbacks: {}
      description: 'Esa persona vuelve a poder enviarle mensajes directos a quien la bloqueó (y al revés). Es idempotente: desbloquear a alguien que no estaba bloqueado también responde 204.'
      operationId: MessagingWeb.BlockController.delete
      parameters:
        - description: Id del usuario a desbloquear
          in: path
          name: user_id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
      responses:
        '204':
          description: Usuario desbloqueado
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Intentó desbloquearse a sí mismo
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El id no es válido
      summary: Desbloquear a un usuario
      tags:
        - blocks
  /v1/channels/{channel_id}/mentions/read:
    post:
      callbacks: {}
      description: Marca como leídas todas tus menciones en ese canal (por ejemplo, al abrirlo). Las que lleguen después siguen sin leer. Es idempotente.
      operationId: MessagingWeb.MentionController.read
      parameters:
        - description: UUID del canal
          in: path
          name: channel_id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
      responses:
        '204':
          description: Menciones del canal marcadas como leídas
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El canal no existe
      summary: Marcar como leídas mis menciones de un canal
      tags:
        - mentions
  /v1/channels/{channel_id}/messages:
    get:
      callbacks: {}
      description: Cada página viene en orden cronológico (del más viejo al más nuevo). Sin cursor devuelve los mensajes más recientes; con `before` devuelve los anteriores a ese mensaje; con `after` devuelve los posteriores (para ponerse al día tras una desconexión); con `around` devuelve el historial alrededor de ese mensaje, incluido él (para saltar a un resultado de la búsqueda), y la respuesta trae además `newer_cursor`. `before`, `after` y `around` son excluyentes.
      operationId: MessagingWeb.MessageController.index
      parameters:
        - description: UUID del canal
          in: path
          name: channel_id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
        - description: Tamaño de página (default 50, máx 100)
          in: query
          name: limit
          required: false
          schema:
            type: integer
            x-struct:
            x-validate:
        - description: Id de mensaje devuelto como next_cursor al pedir la página anterior
          in: query
          name: before
          required: false
          schema:
            type: string
            x-struct:
            x-validate:
        - description: Id del último mensaje que el cliente ya tiene; devuelve los posteriores
          in: query
          name: after
          required: false
          schema:
            type: string
            x-struct:
            x-validate:
        - description: 'Id de un mensaje: devuelve hasta limit/2 mensajes antes y después de él, y el mensaje'
          in: query
          name: around
          required: false
          schema:
            type: string
            x-struct:
            x-validate:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
          description: Página de mensajes en orden cronológico
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Cursor inválido, de otro canal, o más de uno entre `before`, `after` y `around`
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El usuario no tiene VIEW_CHANNELS en este canal
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El canal no existe, o el mensaje de `around` no existe o fue eliminado
      summary: Historial de mensajes de un canal
      tags:
        - messages
  /v1/channels/{channel_id}/messages/{message_id}:
    delete:
      callbacks: {}
      description: Lo puede eliminar su autor o un miembro con `MANAGE_MESSAGES` en el canal (los administradores lo tienen implícito). Quien elimina tiene que poder ver el canal (`VIEW_CHANNELS`). El mensaje deja de aparecer en el historial y su contenido se borra; se emite en tiempo real a los miembros con el canal abierto como evento `message_deleted`, y los clientes desconectados lo reciben al reconectar en `changed_messages.deleted_ids`. Eliminar un mensaje ya eliminado responde 404.
      operationId: MessagingWeb.MessageController.delete
      parameters:
        - description: UUID del canal
          in: path
          name: channel_id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
        - description: UUID del mensaje
          in: path
          name: message_id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
      responses:
        '204':
          description: Mensaje eliminado
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No es el autor ni tiene MANAGE_MESSAGES, o no puede ver el canal
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El canal o el mensaje no existen (o ya fue eliminado)
      summary: Eliminar un mensaje
      tags:
        - messages
    patch:
      callbacks: {}
      description: Solo el autor puede editarlo y tiene que seguir pudiendo escribir en el canal (`SEND_MESSAGES`). El contenido nuevo pasa las mismas reglas que al enviar (se recorta, no puede quedar vacío ni superar los 2000 caracteres). Si queda igual al actual no se marca como editado ni se emite nada. Al editar, el mensaje completo se emite en tiempo real a los miembros con el canal abierto como evento `message_updated`.
      operationId: MessagingWeb.MessageController.update
      parameters:
        - description: UUID del canal
          in: path
          name: channel_id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
        - description: UUID del mensaje
          in: path
          name: message_id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageRequest'
        description: Contenido nuevo
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: El mensaje, ya editado
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Contenido vacío, demasiado largo o con palabras prohibidas (`BANNED_WORD`), o cuerpo mal formado
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No es el autor del mensaje, o no tiene SEND_MESSAGES en el canal
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El canal o el mensaje no existen
      summary: Editar un mensaje propio
      tags:
        - messages
  /v1/conversations:
    get:
      callbacks: {}
      description: Solo aparecen las conversaciones que ya tienen al menos un mensaje, la más reciente primero. `unread` es `true` si el último mensaje es del otro participante y todavía no lo marcaste como leído. `last_message` es `null` si ese mensaje fue eliminado. Para ver el historial de una conversación se usa `GET /v1/channels/{id}/messages` con el `id` de la conversación.
      operationId: MessagingWeb.ConversationController.index
      parameters:
        - description: Cantidad máxima (default 50, máx 100)
          in: query
          name: limit
          required: false
          schema:
            type: integer
            x-struct:
            x-validate:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
          description: Conversaciones del usuario
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
      summary: Mis conversaciones directas
      tags:
        - conversations
  /v1/conversations/{id}/read:
    post:
      callbacks: {}
      description: Marca como leído todo hasta el último mensaje que hoy tiene la conversación. Un mensaje que llegue después sigue sin leer. Si no existe o no sos participante, 404.
      operationId: MessagingWeb.ConversationController.read
      parameters:
        - description: Id de la conversación
          in: path
          name: id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
      responses:
        '204':
          description: Conversación marcada como leída
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: La conversación no existe o el usuario no participa
      summary: Marcar una conversación como leída
      tags:
        - conversations
  /v1/mentions:
    get:
      callbacks: {}
      description: 'Las notificaciones destacadas (historia #46) que todavía no leíste, la más reciente primero, cada una con su mensaje. Las mismas que llegan en vivo como evento `mention` en `user:<tu id>`; acá están para quien estaba desconectado. Se marcan como leídas por canal con `POST /v1/channels/{channel_id}/mentions/read`.'
      operationId: MessagingWeb.MentionController.index
      parameters:
        - description: Cantidad máxima (default 50, máx 100)
          in: query
          name: limit
          required: false
          schema:
            type: integer
            x-struct:
            x-validate:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentionList'
          description: Menciones sin leer
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
      summary: Mis menciones sin leer
      tags:
        - mentions
  /v1/messages:
    get:
      callbacks: {}
      description: Devuelve los mensajes pedidos (hasta 50, separados por coma) que existen, no fueron eliminados y están en un canal que el usuario puede ver (`VIEW_CHANNELS`, o ser parte de la conversación en un mensaje directo). Los demás se omiten sin avisar, así que no se revela si existen. Vienen en el orden pedido. Sirve para mostrar el texto de cada entrada de `GET /v1/notifications/history`, que solo guarda ids.
      operationId: MessagingWeb.MessageController.lookup
      parameters:
        - description: Ids de mensaje separados por coma (de 1 a 50)
          in: query
          name: ids
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageLookup'
          description: Mensajes visibles
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Falta `ids`, viene vacío o tiene más de 50
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudieron leer los mensajes
      summary: Mensajes por id
      tags:
        - messages
  /v1/presence:
    get:
      callbacks: {}
      description: La foto inicial para la lista de mensajes directos o un perfil público; los cambios siguientes llegan por el socket (`presence_updated`). Para la lista de miembros de un servidor conviene unirse a `presence:<server_id>`, cuyo `join` ya trae la foto. `invisible` se ve como `offline`, igual que cualquiera con un bloqueo con quien pregunta, en cualquier dirección.
      operationId: MessagingWeb.PresenceController.index
      parameters:
        - description: Ids separados por coma, hasta 100
          in: query
          name: user_ids
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceList'
          description: Estado de cada usuario pedido
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Faltan los ids, son más de 100 o alguno no es válido
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo leer el estado de actividad
      summary: Estado de actividad de varios usuarios
      tags:
        - presence
  /v1/servers/{server_id}/messages/search:
    get:
      callbacks: {}
      description: 'Busca en los canales de texto del servidor donde el usuario tiene `VIEW_CHANNELS` (historia #49). `q` encuentra los mensajes que contienen ese texto, aunque sea parte de una palabra y sin distinguir mayúsculas; `author_id` se queda con los de ese autor. Tiene que venir al menos uno de los dos, y si vienen ambos se combinan. Los resultados van del más nuevo al más viejo y no incluyen mensajes eliminados. Sin coincidencias responde 200 con `messages` vacío.'
      operationId: MessagingWeb.SearchController.index
      parameters:
        - description: UUID del servidor
          in: path
          name: server_id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
        - description: Texto a buscar (se recorta; hasta 100 caracteres)
          in: query
          name: q
          required: false
          schema:
            type: string
            x-struct:
            x-validate:
        - description: Id del autor de los mensajes
          in: query
          name: author_id
          required: false
          schema:
            type: string
            x-struct:
            x-validate:
        - description: Buscar solo en este canal del servidor
          in: query
          name: channel_id
          required: false
          schema:
            type: string
            x-struct:
            x-validate:
        - description: Tamaño de página (default 25, máx 50)
          in: query
          name: limit
          required: false
          schema:
            type: integer
            x-struct:
            x-validate:
        - description: Id devuelto como next_cursor, para traer las coincidencias más viejas
          in: query
          name: before
          required: false
          schema:
            type: string
            x-struct:
            x-validate:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSearchResult'
          description: Coincidencias de la búsqueda
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Búsqueda inválida (`INVALID_SEARCH_QUERY`) o cursor inválido (`INVALID_CURSOR`)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No es miembro del servidor (`NOT_SERVER_MEMBER`) o no puede ver el `channel_id` pedido
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El `channel_id` no es un canal de texto de este servidor
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo completar la búsqueda (`SEARCH_UNAVAILABLE`)
      summary: Buscar mensajes en un servidor
      tags:
        - messages
  /v1/socket-tickets:
    post:
      callbacks: {}
      description: El navegador no puede mandar el header Authorization al abrir un WebSocket, y poner el JWT en la URL lo deja en logs. En su lugar, el cliente pide acá un ticket (autenticado con el Bearer normal) y conecta con `?ticket=<ticket>`.
      operationId: MessagingWeb.SocketTicketController.create
      parameters: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocketTicket'
          description: Ticket emitido
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No se pudo guardar el ticket
      summary: Emite un ticket de un solo uso para conectar el WebSocket
      tags:
        - auth
security: []
servers:
  - url: http://localhost:4000
    variables: {}
tags: []
