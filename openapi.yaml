info:
  description: Mensajes de canal en tiempo real (envío por WebSocket, historial por REST).
  title: Discordia — Messaging
  version: 0.1.0
openapi: 3.0.0
paths:
  /livez:
    get:
      callbacks: {}
      operationId: MessagingWeb.HealthController.livez
      parameters: []
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
                x-struct:
                x-validate:
          description: ok
      summary: Liveness -- confirma que el proceso responde, sin tocar Mongo ni el broker
      tags:
        - ops
  /readyz:
    get:
      callbacks: {}
      operationId: MessagingWeb.HealthController.readyz
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                x-struct:
                x-validate:
          description: ready
        '503':
          content:
            application/json:
              schema:
                type: object
                x-struct:
                x-validate:
          description: Mongo no responde
      summary: Readiness -- confirma que el servicio puede operar (pinguea Mongo)
      tags:
        - ops
  /v1/channels/{channel_id}/messages:
    get:
      callbacks: {}
      operationId: MessagingWeb.MessageController.index
      parameters:
        - description: UUID del canal
          in: path
          name: channel_id
          required: true
          schema:
            type: string
            x-struct:
            x-validate:
        - description: Tamaño de página (default 50, máx 100)
          in: query
          name: limit
          required: false
          schema:
            type: integer
            x-struct:
            x-validate:
        - description: Id de mensaje devuelto como next_cursor en la página anterior
          in: query
          name: before
          required: false
          schema:
            type: string
            x-struct:
            x-validate:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
          description: Página de mensajes, más nuevos primero
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Falta o es inválido el Authorization: Bearer <jwt>'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El usuario no tiene SEND_MESSAGES en este canal
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: El canal no existe
      summary: Historial de mensajes de un canal
      tags:
        - messages
security: []
servers:
  - url: http://localhost:4000
    variables: {}
tags: []
